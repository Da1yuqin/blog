<meta charset="utf-8">

{% include seo.html %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} · 公开文章" href="{{ site.blog_access_api | append: '/api/blog/feed' | escape }}">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<meta http-equiv="cleartype" content="on">
<base target="_blank">
